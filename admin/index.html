<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men Lành — Quản Trị (Admin)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F8F4EC;
      --cream-tint: #EDF2EC;
      --white: #FFFFFF;
      --forest: #223623;
      --sage: #5A7D56;
      --honey: #D49226;
      --honey-hover: #B87B1A;
      --brown: #463528;
      --brown-light: #6E5A4B;
      --danger: #C0392B;
      --border: rgba(70, 53, 40, 0.12);
      --radius: 14px;
      --shadow: 0 4px 20px rgba(34, 54, 35, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: var(--cream);
      color: var(--brown);
      min-height: 100vh;
    }
    header {
      background: var(--forest);
      color: var(--cream);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .brand { display: flex; align-items: baseline; gap: 0.6rem; }
    .brand h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.45rem; color: var(--white); }
    .brand span {
      font-size: 0.78rem;
      background: rgba(212, 146, 38, 0.25);
      color: #F8D38A;
      padding: 0.2rem 0.65rem;
      border-radius: 50px;
      font-weight: 600;
    }
    .header-actions { display: flex; align-items: center; gap: 0.6rem; font-size: 0.82rem; }
    main { max-width: 1160px; margin: 1.5rem auto; padding: 0 1.2rem 3rem; }

    /* PIN Gate */
    .pin-card {
      max-width: 390px;
      margin: 4.5rem auto;
      background: var(--white);
      border-radius: 18px;
      padding: 2rem 1.75rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }
    .pin-card h2 { font-family: 'Playfair Display', Georgia, serif; color: var(--forest); margin-bottom: 0.45rem; }
    .pin-card p { font-size: 0.86rem; color: var(--brown-light); margin-bottom: 1.25rem; }
    .pin-card input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 0.25em;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    .pin-card input:focus { outline: none; border-color: var(--sage); }

    .tabs { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .tab-btn {
      background: var(--white);
      color: var(--brown-light);
      border: 1.5px solid var(--border);
      padding: 0.68rem 1.2rem;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s;
    }
    .tab-btn:hover { border-color: var(--sage); color: var(--forest); }
    .tab-btn.active { background: var(--forest); color: var(--white); border-color: var(--forest); }
    .tab-count {
      background: rgba(90, 125, 86, 0.16);
      color: var(--forest);
      font-size: 0.74rem;
      padding: 0.1rem 0.5rem;
      border-radius: 50px;
    }
    .tab-btn.active .tab-count { background: rgba(255, 255, 255, 0.22); color: var(--white); }

    .panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .panel-header {
      padding: 1.1rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .panel-header h2 { font-size: 1.08rem; color: var(--forest); }
    .panel-header-btns { display: flex; gap: 0.5rem; }

    .btn {
      border: none;
      border-radius: 50px;
      padding: 0.55rem 1.15rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .btn-primary { background: var(--honey); color: var(--white); }
    .btn-primary:hover { background: var(--honey-hover); }
    .btn-outline { background: var(--cream); color: var(--forest); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--cream-tint); }
    .btn-ghost { background: rgba(255, 255, 255, 0.12); color: var(--cream); }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.22); }
    .btn-sm { padding: 0.32rem 0.7rem; font-size: 0.78rem; border-radius: 8px; }
    .btn-danger { background: rgba(192, 57, 43, 0.1); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: var(--white); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    th, td {
      padding: 0.82rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(70, 53, 40, 0.08);
      vertical-align: middle;
    }
    th {
      background: #FAF8F4;
      color: var(--brown-light);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    tr:hover td { background: #FDFBF7; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--brown-light); }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-physical { background: rgba(90, 125, 86, 0.15); color: var(--forest); }
    .badge-digital { background: rgba(52, 152, 219, 0.15); color: #1B6CA8; }
    .badge-service { background: rgba(212, 146, 38, 0.18); color: #9A6108; }
    .badge-paid { background: rgba(39, 174, 96, 0.16); color: #1E7E45; }
    .badge-pending { background: rgba(212, 146, 38, 0.18); color: #9A6108; }
    .badge-cancel { background: rgba(192, 57, 43, 0.13); color: var(--danger); }
    .actions { display: flex; gap: 0.4rem; white-space: nowrap; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 38, 25, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }
    .modal-header {
      padding: 1.05rem 1.35rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 1.05rem; color: var(--forest); }
    .modal-close {
      background: var(--cream);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      color: var(--brown);
    }
    .modal-body { padding: 1.2rem 1.35rem; }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.58rem 0.78rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.89rem;
      color: var(--brown);
      background: var(--white);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--sage);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .hint { font-size: 0.77rem; color: var(--brown-light); margin-top: 0.28rem; }
    .hint-box {
      background: var(--cream-tint);
      border-left: 3px solid var(--sage);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--forest);
      margin-bottom: 0.9rem;
    }
    .modal-footer { padding: 0.85rem 1.35rem 1.15rem; display: flex; justify-content: flex-end; gap: 0.55rem; }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--forest);
      color: var(--white);
      padding: 0.75rem 1.2rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 200;
    }
    .toast.error { background: var(--danger); }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>men lành</h1>
      <span>Admin · Google Sheets</span>
    </div>
    <div class="header-actions" id="headerActions" style="display:none;">
      <a class="btn btn-ghost btn-sm" href="/thanh-toan" style="text-decoration:none;">💳 Trang thanh toán ↗</a>
      <button class="btn btn-ghost btn-sm" onclick="loadAllData()">↻ Làm mới</button>
      <button class="btn btn-ghost btn-sm" onclick="logoutAdmin()">Khóa lại</button>
    </div>
  </header>

  <main>
    <!-- Màn hình nhập mã PIN -->
    <section class="pin-card" id="pinGate">
      <h2>🔐 Quản trị Men Lành</h2>
      <p>Nhập mã PIN quản trị để mở bảng Sản phẩm, Khách hàng & Đơn hàng đồng bộ từ Google Sheets.</p>
      <form onsubmit="handlePinLogin(event)">
        <input type="password" id="pinInput" placeholder="••••" required autofocus>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;" id="pinBtn">Mở trang quản trị →</button>
      </form>
    </section>

    <!-- Nội dung Admin chính -->
    <div id="adminApp" style="display:none;">
      <div class="tabs">
        <button class="tab-btn active" data-tab="orders" onclick="switchTab('orders')">
          🧾 Đơn hàng <span class="tab-count" id="count-orders">0</span>
        </button>
        <button class="tab-btn" data-tab="products" onclick="switchTab('products')">
          🥛 Sản phẩm <span class="tab-count" id="count-products">0</span>
        </button>
        <button class="tab-btn" data-tab="customers" onclick="switchTab('customers')">
          👤 Khách hàng <span class="tab-count" id="count-customers">0</span>
        </button>
      </div>

      <section class="panel">
        <div class="panel-header">
          <h2 id="panelTitle">Danh sách Đơn hàng</h2>
          <div class="panel-header-btns">
            <button class="btn btn-primary" onclick="openCreateModal()">+ Thêm mới</button>
          </div>
        </div>
        <div class="table-wrap" id="tableContainer"></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Thêm mới</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="modalForm" onsubmit="handleFormSubmit(event)">
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Hủy</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Lưu lại</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxXoefhH0DLPc_E6HA3wO-fiOASfaTheu8_fpRVMPOHFAkQ8XjoWPKpyHt6FzHFyJW/exec";
    const DEFAULT_PIN = "2026";

    const SEED_PRODUCTS = [
      { id: 1, name: 'Kefir Nguyên Chất 500ml', type: 'physical', price: 40000, description: 'Chai 500ml ủ tươi thủ công 20–24h từ hạt nấm Tây Tạng sống', stock_quantity: 24, created_at: '20/11/2026 08:00:00' },
      { id: 2, name: 'Kefir Nguyên Chất 1 Lít (1.000ml)', type: 'physical', price: 70000, description: 'Chai 1 Lít tiết kiệm cho cả tuần hoặc gia đình', stock_quantity: 18, created_at: '20/11/2026 08:00:00' },
      { id: 3, name: 'Cẩm nang 7 ngày chăm ruột (Gói Test SePay)', type: 'digital', price: 2000, description: 'Tài liệu số & gói kiểm thử thanh toán QR tự động (không trừ tồn kho)', stock_quantity: null, created_at: '23/11/2026 09:00:00' }
    ];

    const SEED_CUSTOMERS = [
      { id: 1, name: 'Nguyễn Chí Thành', phone: '0934857201', zalo: '0934857201', registered_at: '24/11/2026 07:57:00' },
      { id: 2, name: 'Minh Anh', phone: '0908123456', zalo: 'minhanh.hcm@gmail.com', registered_at: '24/11/2026 08:04:00' },
      { id: 3, name: 'Thu Thảo', phone: '0919223344', zalo: '0919223344', registered_at: '22/11/2026 14:20:00' },
      { id: 4, name: 'Lan Hương', phone: '0987654321', zalo: '0987654321', registered_at: '21/11/2026 09:15:00' }
    ];

    const SEED_ORDERS = [
      { order_date: '24/11/2026 08:04:00', order_code: 'ML472448', customer_name: 'Minh Anh', phone: '0908123456', address: 'Quận 3, TP.HCM', items: '1x Kefir Nguyên Chất 500ml', amount: 40000, status: 'Đã thanh toán', paid_amount: 40000, paid_at: '24/11/2026 08:04:12', sepay_ref: 'FT26329721013960', note: 'SePay xác nhận tự động qua OCB' },
      { order_date: '24/11/2026 07:57:00', order_code: 'ML99999', customer_name: 'Nguyễn Chí Thành', phone: '0934857201', address: 'Sản phẩm số (nhận qua Email)', items: '1x Gói Test SePay (Digital)', amount: 2000, status: 'Đã thanh toán', paid_amount: 2000, paid_at: '24/11/2026 07:57:05', sepay_ref: 'FT26329847140107', note: 'Đơn test SePay 2.000đ thành công' },
      { order_date: '23/11/2026 16:30:00', order_code: 'ML88210', customer_name: 'Thu Thảo', phone: '0919223344', address: 'Quận Bình Thạnh, TP.HCM', items: '1x Kefir Nguyên Chất 1 Lít', amount: 70000, status: 'Đã thanh toán', paid_amount: 70000, paid_at: '23/11/2026 16:31:10', sepay_ref: 'SEPAY-OK', note: 'Giao sáng trước 11h' }
    ];

    const state = {
      pin: localStorage.getItem('menlanh_admin_pin') || '',
      tab: 'orders',
      products: [],
      customers: [],
      orders: [],
      editingItem: null,
      remoteAdminReady: false
    };

    function nowVN() {
      const d = new Date();
      const pad = v => String(v).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function getLocal(key, seed) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch {}
      const cloned = seed.map(x => ({ ...x }));
      localStorage.setItem(key, JSON.stringify(cloned));
      return cloned;
    }

    function setLocal(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    const TYPE_LABELS = {
      physical: 'Vật lý (physical)',
      digital: 'Sản phẩm số (digital)',
      service: 'Dịch vụ (service)'
    };

    function formatVND(n) {
      return Number(n || 0).toLocaleString('vi-VN') + 'đ';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.className = 'toast'; }, 3200);
    }

    async function postAction(payload) {
      if (!state.remoteAdminReady) {
        return { status: 'local_only' };
      }
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...payload, pin: state.pin })
      });
      const json = await res.json();
      if (json.status === 'error') throw new Error(json.error || 'Có lỗi xảy ra');
      return json;
    }

    function mergeByKey(primary, secondary, keyName) {
      const map = new Map();
      secondary.forEach(item => map.set(String(item[keyName]), item));
      primary.forEach(item => map.set(String(item[keyName]), item));
      return Array.from(map.values());
    }

    async function syncPendingWithSepay(orders) {
      const pending = orders.filter(o => o.status === 'Chờ thanh toán' || o.status === 'pending');
      if (!pending.length) return orders;
      let changed = false;
      await Promise.all(pending.map(async (ord) => {
        try {
          const r = await fetch(`${SCRIPT_URL}?action=check_order&order_code=${encodeURIComponent(ord.order_code)}`);
          const d = await r.json();
          if (d && d.payment_status === 'Đã thanh toán') {
            ord.status = 'Đã thanh toán';
            ord.paid_amount = d.paid_amount || ord.amount;
            ord.paid_at = d.paid_at || nowVN();
            changed = true;
          }
        } catch {}
      }));
      if (changed) setLocal('menlanh_admin_orders', orders);
      return orders;
    }

    async function loadAllData() {
      const localProducts = getLocal('menlanh_admin_products', SEED_PRODUCTS);
      const localCustomers = getLocal('menlanh_admin_customers', SEED_CUSTOMERS);
      const localOrders = getLocal('menlanh_admin_orders', SEED_ORDERS);

      let remoteProducts = [];
      let remoteCustomers = [];
      let remoteOrders = [];

      if (state.pin !== DEFAULT_PIN && !state.remoteAdminReady) {
        // Kiểm tra PIN ở bước gọi remote hoặc đối chiếu PIN cục bộ
      }

      try {
        const res = await fetch(`${SCRIPT_URL}?action=admin_list&pin=${encodeURIComponent(state.pin)}`);
        const json = await res.json();
        if (json.status === 'error') throw new Error(json.error || 'Sai mã PIN quản trị.');
        if (json.status === 'success' && Array.isArray(json.products)) {
          state.remoteAdminReady = true;
          remoteProducts = json.products;
          remoteCustomers = json.customers || [];
          remoteOrders = json.orders || [];
        } else {
          state.remoteAdminReady = false;
          if (state.pin !== DEFAULT_PIN) throw new Error('Sai mã PIN quản trị.');
        }
      } catch (err) {
        if (String(err.message || '').includes('PIN')) throw err;
        state.remoteAdminReady = false;
        if (state.pin !== DEFAULT_PIN) throw new Error('Sai mã PIN quản trị.');
      }

      state.products = remoteProducts.length ? remoteProducts : localProducts;
      state.customers = remoteCustomers.length ? mergeByKey(remoteCustomers, localCustomers, 'phone') : localCustomers;
      state.orders = remoteOrders.length ? mergeByKey(remoteOrders, localOrders, 'order_code') : localOrders;

      await syncPendingWithSepay(state.orders);

      document.getElementById('count-products').textContent = state.products.length;
      document.getElementById('count-customers').textContent = state.customers.length;
      document.getElementById('count-orders').textContent = state.orders.length;

      document.getElementById('pinGate').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      document.getElementById('headerActions').style.display = 'flex';
      renderCurrentTab();
    }

    async function handlePinLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('pinBtn');
      const pin = document.getElementById('pinInput').value.trim();
      btn.disabled = true;
      btn.textContent = '⏳ Đang kiểm tra...';
      state.pin = pin;
      try {
        await loadAllData();
        localStorage.setItem('menlanh_admin_pin', pin);
        showToast('Đăng nhập quản trị thành công!');
      } catch (err) {
        state.pin = '';
        localStorage.removeItem('menlanh_admin_pin');
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mở trang quản trị →';
      }
    }

    function logoutAdmin() {
      state.pin = '';
      localStorage.removeItem('menlanh_admin_pin');
      document.getElementById('adminApp').style.display = 'none';
      document.getElementById('headerActions').style.display = 'none';
      document.getElementById('pinGate').style.display = 'block';
      document.getElementById('pinInput').value = '';
    }

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      const titles = {
        orders: 'Danh sách Đơn hàng (Đồng bộ Website & SePay)',
        products: 'Danh sách Sản phẩm',
        customers: 'Danh sách Khách hàng'
      };
      document.getElementById('panelTitle').textContent = titles[tab];
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('tableContainer');

      if (state.tab === 'products') {
        if (!state.products.length) {
          container.innerHTML = '<div class="empty-state">Chưa có sản phẩm nào trong tab <strong>SanPham</strong>. Bấm <strong>+ Thêm mới</strong> để tạo nhé!</div>';
          return;
        }
        container.innerHTML = `
          <table>
            <thead>
              <tr><th>ID</th><th>Tên sản phẩm</th><th>Loại</th><th>Giá</th><th>Tồn kho</th><th>Mô tả</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
              ${state.products.map(p => `
                <tr>
                  <td>#${p.id}</td>
                  <td><strong>${escapeHtml(p.name)}</strong></td>
                  <td><span class="badge badge-${p.type}">${TYPE_LABELS[p.type] || p.type}</span></td>
                  <td><strong>${formatVND(p.price)}</strong></td>
                  <td>${p.stock_quantity === null || p.stock_quantity === undefined ? '<span style="color:#917C6C">—</span>' : `<strong>${p.stock_quantity}</strong>`}</td>
                  <td>${escapeHtml(p.description)}</td>
                  <td class="actions">
                    <button class="btn btn-outline btn-sm" onclick="openEditModal('products', ${p.id})">Sửa</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteItem('products', ${p.id})">Xóa</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      if (state.tab === 'customers') {
        if (!state.customers.length) {
          container.innerHTML = '<div class="empty-state">Chưa có khách hàng nào trong tab <strong>KhachHang</strong>. Bấm <strong>+ Thêm mới</strong> để thêm nhé!</div>';
          return;
        }
        container.innerHTML = `
          <table>
            <thead>
              <tr><th>ID</th><th>Tên khách hàng</th><th>Số điện thoại</th><th>Zalo</th><th>Ngày đăng ký</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
              ${state.customers.map(c => `
                <tr>
                  <td>#${c.id}</td>
                  <td><strong>${escapeHtml(c.name)}</strong></td>
                  <td>${escapeHtml(c.phone || '—')}</td>
                  <td>${escapeHtml(c.zalo || '—')}</td>
                  <td>${escapeHtml(c.registered_at)}</td>
                  <td class="actions">
                    <button class="btn btn-outline btn-sm" onclick="openEditModal('customers', ${c.id})">Sửa</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteItem('customers', ${c.id})">Xóa</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      if (state.tab === 'orders') {
        if (!state.orders.length) {
          container.innerHTML = '<div class="empty-state">Chưa có đơn hàng nào trong tab <strong>DonHang</strong>.</div>';
          return;
        }
        container.innerHTML = `
          <table>
            <thead>
              <tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Tiền sữa</th><th>Trạng thái</th><th>Ngày đặt</th><th>Ghi chú</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
              ${state.orders.map(o => {
                const stClass = (o.status === 'Đã thanh toán' || o.status === 'Hoàn thành')
                  ? 'badge-paid'
                  : (o.status === 'Đã hủy' || o.status === 'Thiếu tiền' ? 'badge-cancel' : 'badge-pending');
                return `
                  <tr>
                    <td><strong>${escapeHtml(o.order_code)}</strong></td>
                    <td><strong>${escapeHtml(o.customer_name)}</strong><br><small style="color:#6E5A4B">${escapeHtml(o.phone)}</small>${o.address ? `<br><small style="color:#917C6C">${escapeHtml(o.address)}</small>` : ''}</td>
                    <td>${escapeHtml(o.items)}</td>
                    <td><strong>${formatVND(o.amount)}</strong></td>
                    <td><span class="badge ${stClass}">${escapeHtml(o.status)}</span></td>
                    <td><small>${escapeHtml(o.order_date)}</small></td>
                    <td><small>${escapeHtml(o.note)}</small></td>
                    <td class="actions">
                      ${(o.status === 'Chờ thanh toán' || o.status === 'pending' || o.status === 'Thiếu tiền')
                        ? `<button class="btn btn-primary btn-sm" style="background:#2E7D32;" onclick="manualConfirmPayment('${escapeHtml(o.order_code)}')">✓ Xác nhận TT</button>`
                        : ''}
                      <button class="btn btn-outline btn-sm" onclick="openEditOrder('${escapeHtml(o.order_code)}')">Sửa</button>
                      <button class="btn btn-danger btn-sm" onclick="deleteOrder('${escapeHtml(o.order_code)}')">Xóa</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }
    }

    function openCreateModal() {
      state.editingItem = null;
      renderModalForm(null);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openEditModal(tab, id) {
      const item = state[tab].find(x => x.id === id);
      if (!item) return;
      state.editingItem = item;
      renderModalForm(item);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function openEditOrder(code) {
      const item = state.orders.find(x => x.order_code === code);
      if (!item) return;
      state.editingItem = item;
      renderModalForm(item);
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function renderModalForm(item) {
      const isEdit = Boolean(item);
      const body = document.getElementById('modalBody');
      const title = document.getElementById('modalTitle');

      if (state.tab === 'products') {
        title.textContent = isEdit ? `Sửa sản phẩm #${item.id}` : 'Thêm sản phẩm mới';
        const curType = item ? item.type : 'physical';
        const curStock = item && item.stock_quantity !== null && item.stock_quantity !== undefined ? item.stock_quantity : '';
        body.innerHTML = `
          <div class="form-group">
            <label>Tên sản phẩm *</label>
            <input name="name" required value="${escapeHtml(item ? item.name : '')}" placeholder="Ví dụ: Kefir Nguyên Chất 1 Lít">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Loại sản phẩm *</label>
              <select name="type" id="prodTypeSelect" onchange="toggleStockField()">
                <option value="physical" ${curType === 'physical' ? 'selected' : ''}>Vật lý (physical)</option>
                <option value="digital" ${curType === 'digital' ? 'selected' : ''}>Sản phẩm số (digital)</option>
                <option value="service" ${curType === 'service' ? 'selected' : ''}>Dịch vụ (service)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Giá (VNĐ) *</label>
              <input name="price" type="number" min="0" required value="${item ? item.price : ''}" placeholder="70000">
            </div>
          </div>
          <div class="form-group">
            <label id="stockLabel">Số lượng còn lại ${curType === 'physical' ? '*' : '(có thể để trống)'}</label>
            <input name="stock_quantity" id="stockInput" type="number" min="0" value="${curStock}" ${curType === 'physical' ? 'required' : ''} placeholder="${curType === 'physical' ? 'Nhập tồn kho' : 'Để trống nếu không quản lý kho'}">
            <div class="hint">Bắt buộc với sản phẩm vật lý. Sản phẩm số / dịch vụ có thể để trống.</div>
          </div>
          <div class="form-group">
            <label>Mô tả</label>
            <textarea name="description" rows="2">${escapeHtml(item ? item.description : '')}</textarea>
          </div>
        `;
      }

      if (state.tab === 'customers') {
        title.textContent = isEdit ? `Sửa khách hàng #${item.id}` : 'Thêm khách hàng mới';
        body.innerHTML = `
          <div class="form-group">
            <label>Tên khách hàng *</label>
            <input name="name" required value="${escapeHtml(item ? item.name : '')}" placeholder="Ví dụ: Minh Anh">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Số điện thoại</label>
              <input name="phone" value="${escapeHtml(item ? item.phone : '')}" placeholder="0934857201">
            </div>
            <div class="form-group">
              <label>Zalo</label>
              <input name="zalo" value="${escapeHtml(item ? item.zalo : '')}" placeholder="SĐT hoặc tên Zalo">
            </div>
          </div>
          <div class="form-group">
            <label>Ngày đăng ký (để trống tự lấy hiện tại)</label>
            <input name="registered_at" value="${escapeHtml(item ? item.registered_at : '')}">
          </div>
        `;
      }

      if (state.tab === 'orders') {
        title.textContent = isEdit ? `Sửa đơn hàng ${item.order_code}` : 'Tạo đơn hàng mới';
        const curStatus = item ? item.status : 'Chờ thanh toán';
        const productSelectHtml = (!isEdit && state.products.length)
          ? `
            <div class="hint-box" id="orderStockHint"></div>
            <div class="form-row">
              <div class="form-group">
                <label>Chọn nhanh từ Sản phẩm</label>
                <select name="product_id" id="orderProductSelect" onchange="syncOrderProduct()">
                  <option value="">-- Nhập tay bên dưới --</option>
                  ${state.products.map(p => `<option value="${p.id}">${escapeHtml(p.name)} — ${formatVND(p.price)} [${p.type}${p.type === 'physical' ? ', còn ' + p.stock_quantity : ''}]</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>Số lượng</label>
                <input name="quantity" id="orderQtyInput" type="number" min="1" value="1" oninput="syncOrderProduct()">
              </div>
            </div>
          `
          : '';

        body.innerHTML = `
          ${productSelectHtml}
          <div class="form-row">
            <div class="form-group">
              <label>Tên khách hàng *</label>
              <input name="customer_name" required value="${escapeHtml(item ? item.customer_name : '')}" placeholder="Tên người nhận">
            </div>
            <div class="form-group">
              <label>Số điện thoại / Zalo</label>
              <input name="phone" value="${escapeHtml(item ? item.phone : '')}" placeholder="093...">
            </div>
          </div>
          <div class="form-group">
            <label>Địa chỉ giao hàng</label>
            <input name="address" value="${escapeHtml(item ? item.address : '')}" placeholder="Địa chỉ tại TP.HCM">
          </div>
          <div class="form-group">
            <label>Sản phẩm đặt mua *</label>
            <input name="items" id="orderItemsInput" required value="${escapeHtml(item ? item.items : '')}" placeholder="VD: 1x Chai 1 Lít">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Tiền sữa (VNĐ) *</label>
              <input name="amount" id="orderAmountInput" type="number" min="0" required value="${item ? item.amount : ''}">
            </div>
            <div class="form-group">
              <label>Trạng thái</label>
              <select name="status">
                ${['Chờ thanh toán', 'Đã thanh toán', 'Đang giao', 'Hoàn thành', 'Thiếu tiền', 'Đã hủy'].map(st => `<option value="${st}" ${curStatus === st ? 'selected' : ''}>${st}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Mã đơn (tự tạo nếu trống)</label>
              <input name="order_code" value="${escapeHtml(item ? item.order_code : '')}" placeholder="ML123456">
            </div>
            <div class="form-group">
              <label>Ghi chú (phí ship, giờ giao...)</label>
              <input name="note" value="${escapeHtml(item ? item.note : '')}" placeholder="VD: Đã giao, ship 22k">
            </div>
          </div>
        `;
        if (!isEdit && state.products.length) syncOrderProduct();
      }
    }

    function toggleStockField() {
      const type = document.getElementById('prodTypeSelect')?.value;
      const input = document.getElementById('stockInput');
      const label = document.getElementById('stockLabel');
      if (!input || !label) return;
      input.required = type === 'physical';
      label.textContent = type === 'physical' ? 'Số lượng còn lại *' : 'Số lượng còn lại (có thể để trống)';
    }

    function syncOrderProduct() {
      const pid = Number(document.getElementById('orderProductSelect')?.value);
      const qty = Math.max(1, Number(document.getElementById('orderQtyInput')?.value || 1));
      const hint = document.getElementById('orderStockHint');
      const prod = state.products.find(p => p.id === pid);
      if (!prod) {
        if (hint) hint.innerHTML = '💡 Chọn sản phẩm trong danh sách để tự tính tiền và tự trừ tồn kho (nếu là sản phẩm vật lý).';
        return;
      }
      document.getElementById('orderItemsInput').value = `${qty}x ${prod.name}`;
      document.getElementById('orderAmountInput').value = prod.price * qty;
      if (hint) {
        hint.innerHTML = prod.type === 'physical'
          ? `📦 <strong>Sản phẩm vật lý:</strong> Sẽ tự động trừ <strong>${qty}</strong> khỏi tồn kho (hiện còn <strong>${prod.stock_quantity}</strong>).`
          : `✨ <strong>Sản phẩm ${prod.type === 'digital' ? 'số' : 'dịch vụ'}:</strong> Không trừ tồn kho.`;
      }
    }

    async function manualConfirmPayment(orderCode) {
      const ord = state.orders.find(o => o.order_code === orderCode);
      if (!ord) return;
      if (!confirm(`Kích hoạt thanh toán thành công (thủ công) cho đơn ${orderCode} (${formatVND(ord.amount)})?`)) return;

      ord.status = 'Đã thanh toán';
      ord.paid_amount = ord.amount;
      ord.paid_at = nowVN();
      ord.note = ord.note ? `${ord.note} | Xác nhận thủ công bởi Admin` : 'Xác nhận thủ công bởi Admin';
      setLocal('menlanh_admin_orders', state.orders);

      try {
        await postAction({
          action: 'admin_save_order',
          original_order_code: ord.order_code,
          order_code: ord.order_code,
          customer_name: ord.customer_name,
          phone: ord.phone,
          address: ord.address,
          items: ord.items,
          amount: ord.amount,
          status: 'Đã thanh toán',
          order_date: ord.order_date,
          note: ord.note
        });
      } catch (err) {
        console.warn('Manual confirm remote sync:', err);
      }

      renderCurrentTab();
      showToast(`Đã kích hoạt thanh toán thành công cho đơn ${orderCode}!`);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('modalSubmitBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Đang lưu...';
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());

      try {
        if (state.tab === 'products') {
          if (state.editingItem) payload.id = state.editingItem.id;
          const res = await postAction({ action: 'admin_save_product', ...payload });
          if (res.status === 'local_only') {
            const list = getLocal('menlanh_admin_products', SEED_PRODUCTS);
            const stockVal = payload.type === 'physical'
              ? Math.max(0, Math.round(Number(payload.stock_quantity || 0)))
              : (payload.stock_quantity === '' ? null : Math.max(0, Math.round(Number(payload.stock_quantity))));
            if (state.editingItem) {
              const idx = list.findIndex(p => p.id === state.editingItem.id);
              if (idx !== -1) list[idx] = { ...list[idx], name: payload.name, type: payload.type, price: Number(payload.price), description: payload.description || '', stock_quantity: stockVal };
            } else {
              const nextId = list.reduce((m, p) => Math.max(m, Number(p.id || 0)), 0) + 1;
              list.unshift({ id: nextId, name: payload.name, type: payload.type, price: Number(payload.price), description: payload.description || '', stock_quantity: stockVal, created_at: nowVN() });
            }
            setLocal('menlanh_admin_products', list);
          }
        } else if (state.tab === 'customers') {
          if (state.editingItem) payload.id = state.editingItem.id;
          const res = await postAction({ action: 'admin_save_customer', ...payload });
          if (res.status === 'local_only') {
            const list = getLocal('menlanh_admin_customers', SEED_CUSTOMERS);
            if (state.editingItem) {
              const idx = list.findIndex(c => c.id === state.editingItem.id);
              if (idx !== -1) list[idx] = { ...list[idx], name: payload.name, phone: payload.phone || '', zalo: payload.zalo || '', registered_at: payload.registered_at || list[idx].registered_at };
            } else {
              const nextId = list.reduce((m, c) => Math.max(m, Number(c.id || 0)), 0) + 1;
              list.unshift({ id: nextId, name: payload.name, phone: payload.phone || '', zalo: payload.zalo || '', registered_at: payload.registered_at || nowVN() });
            }
            setLocal('menlanh_admin_customers', list);
          }
        } else if (state.tab === 'orders') {
          if (state.editingItem) payload.original_order_code = state.editingItem.order_code;
          const res = await postAction({ action: 'admin_save_order', ...payload });
          if (res.status === 'local_only') {
            const orders = getLocal('menlanh_admin_orders', SEED_ORDERS);
            const code = (payload.order_code || ('ML' + Date.now().toString().slice(-6))).trim().toUpperCase();
            if (state.editingItem) {
              const idx = orders.findIndex(o => o.order_code === state.editingItem.order_code);
              if (idx !== -1) {
                orders[idx] = {
                  ...orders[idx],
                  order_code: code,
                  customer_name: payload.customer_name,
                  phone: payload.phone || '',
                  address: payload.address || '',
                  items: payload.items,
                  amount: Number(payload.amount || 0),
                  status: payload.status,
                  note: payload.note || ''
                };
              }
            } else {
              if (payload.product_id) {
                const prods = getLocal('menlanh_admin_products', SEED_PRODUCTS);
                const prod = prods.find(p => String(p.id) === String(payload.product_id));
                const qty = Math.max(1, Math.round(Number(payload.quantity || 1)));
                if (prod && prod.type === 'physical') {
                  if (Number(prod.stock_quantity || 0) < qty) {
                    throw new Error(`Không đủ tồn kho (còn ${prod.stock_quantity}, cần ${qty}).`);
                  }
                  prod.stock_quantity = Number(prod.stock_quantity) - qty;
                  setLocal('menlanh_admin_products', prods);
                }
              }
              orders.unshift({
                order_date: nowVN(),
                order_code: code,
                customer_name: payload.customer_name,
                phone: payload.phone || '',
                address: payload.address || '',
                items: payload.items,
                amount: Number(payload.amount || 0),
                status: payload.status || 'Chờ thanh toán',
                paid_amount: payload.status === 'Đã thanh toán' ? Number(payload.amount || 0) : 0,
                paid_at: payload.status === 'Đã thanh toán' ? nowVN() : '',
                sepay_ref: '',
                note: payload.note || ''
              });
            }
            setLocal('menlanh_admin_orders', orders);
          } else if (!state.editingItem && res.stock_deducted) {
            showToast('Đã tạo đơn & tự động trừ tồn kho!');
          }
        }
        closeModal();
        await loadAllData();
        showToast('Đã lưu thành công!');
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Lưu lại';
      }
    }

    async function deleteItem(tab, id) {
      if (!confirm('Bạn có chắc muốn xóa mục này không?')) return;
      try {
        const action = tab === 'products' ? 'admin_delete_product' : 'admin_delete_customer';
        const res = await postAction({ action, id });
        if (res.status === 'local_only') {
          const key = tab === 'products' ? 'menlanh_admin_products' : 'menlanh_admin_customers';
          const list = getLocal(key, tab === 'products' ? SEED_PRODUCTS : SEED_CUSTOMERS).filter(x => x.id !== id);
          setLocal(key, list);
        }
        await loadAllData();
        showToast('Đã xóa thành công!');
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function deleteOrder(orderCode) {
      if (!confirm(`Bạn có chắc muốn xóa đơn hàng ${orderCode} không?`)) return;
      try {
        const res = await postAction({ action: 'admin_delete_order', order_code: orderCode });
        if (res.status === 'local_only') {
          const list = getLocal('menlanh_admin_orders', SEED_ORDERS).filter(o => o.order_code !== orderCode);
          setLocal('menlanh_admin_orders', list);
        }
        await loadAllData();
        showToast('Đã xóa đơn hàng!');
      } catch (err) {
        showToast(err.message, true);
      }
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Yêu cầu nhập mã PIN (2026) nếu chưa đăng nhập trong trình duyệt
    if (state.pin) {
      loadAllData().catch(() => {
        state.pin = '';
        localStorage.removeItem('menlanh_admin_pin');
      });
    }
  </script>
</body>
</html>
